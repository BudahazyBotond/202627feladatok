  /api/products/sum:
    get:
      tags:
        - Product
      summary: Az árucikkek összértékének lekérése
      description: |
        A `sum` visszaadja annak az árucikkek összárát a `products` táblából egy `data` kulcsba csomagolva.
      operationId: products.sum
      responses:
        '200':
          description: Az árucikkek összára
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
              example: {"data":662.83}
  /api/products/recommended:
    get:
      tags:
        - Product
      summary: A javasolt árucikkek lekérése
      description: |
        Az `recommended` visszaadja az összes árucikk azonsoítóját és nevét a `products` táblából egy `data` kulcsba csomagolva, amelyek akciósak és 20 eurónál kevesebbe kerülnek.
      operationId: products.recommended
      responses:
        '200':
          description: Az javasolt árucikkek azonostói és nevei
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
