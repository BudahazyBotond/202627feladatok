  /api/products/{id}:
    get:
      tags:
        - Product
      summary: Egy adott árucikk lekérése
      description: |
        A `show` visszaadja egy minon adatait az azonosítója alapján a `products` táblából egy `data` kulcsba csomagolva.
      operationId: products.show
      parameters:
        - name: id
          in: path
          required: true
          description: Az árucikk azonosítója
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Egy product adata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
              example: {"data":{"id":1,"name":"Vanilkov\u00fd cukor 20 kg Intenz\u00edvna vanilkov\u00e1 ar\u00f3ma Ar\u00f3ma na pe\u010denie Cukrovinky \u0160\u013eaha\u010dka GiDel","category":"non-perishables","price":79.99,"discount":null,"free_shipping":1,"image":"1.webp"}}
